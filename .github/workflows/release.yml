name: Release

# Push a tag like v1.0.0 to build the Windows installer and publish a GitHub Release.
# Run it by hand (Actions tab, "Run workflow") to build and test without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build-windows:
    name: Build and test the Windows installer
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/build_release.py --check-tag "${{ github.ref_name }}"
      - name: Make sure Inno Setup is installed
        # The windows-latest image has it; this covers an image that drops it.
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build, smoke test, and make the installer
        run: python scripts/build_release.py --skip-checks
      - name: Install, repair, and uninstall it
        run: python scripts/test_installer.py (Resolve-Path dist/*-setup.exe)
      - uses: actions/upload-artifact@v4
        with:
          name: taste-engine-windows
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: taste-engine-windows
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/build_release.py --notes "$TAG" > notes.md
          gh release create "$TAG" dist/* --title "Taste Engine ${TAG#v}" --notes-file notes.md
